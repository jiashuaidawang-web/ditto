# MySQL 8 + Java API + optional static H5.
# Passwords come from deploy/.env (gitignored). See deploy/.env.example.
#   docker compose --env-file deploy/.env -f docker-compose.java.yml up -d --build
# CentOS 7 hosts should use docker-compose.java.centos7.yml instead.

services:
  mysql:
    image: mysql:8.0
    container_name: ditto-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ditto}
      MYSQL_USER: ${MYSQL_USER:-ditto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
      - --skip-log-bin
      - --log-bin-trust-function-creators=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ditto_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api-java:
    build:
      context: ./apps/api-java
    image: ditto-api-java:local
    container_name: ditto-api-java
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ditto}?characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ditto}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      TZ: Asia/Shanghai
    ports:
      - "${API_JAVA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 36

  h5:
    image: nginx:1.27-alpine
    container_name: ditto-h5
    restart: unless-stopped
    ports:
      - "${H5_PORT:-8088}:80"
    volumes:
      - ./apps/mini/dist/build/h5:/usr/share/nginx/html:ro
      - ./deploy/nginx/h5.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ditto_mysql:
