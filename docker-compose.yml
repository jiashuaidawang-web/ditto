services:
  postgres:
    image: postgres:16-alpine
    container_name: ditto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ditto
      POSTGRES_PASSWORD: ditto
      POSTGRES_DB: ditto
    ports:
      - "5432:5432"
    volumes:
      - ditto_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditto -d ditto"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ditto_pg:
